version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      reship-cargo:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /protocol
    schedule:
      interval: weekly
    groups:
      rsp-cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
