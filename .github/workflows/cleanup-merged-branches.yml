name: Cleanup merged branches

# GitHub's repository-level auto-delete setting is preferred when enabled.
# This workflow provides the same repository-local policy and also documents
# the invariant for future maintainers.
on:
  pull_request_target:
    types: [closed]

permissions:
  contents: write

jobs:
  delete:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged head branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${HEAD_REF}" || {
            echo "Branch may already be deleted or protected; inspect repository settings." >&2
            exit 1
          }
