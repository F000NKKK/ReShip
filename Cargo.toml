[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["protocol"]

[workspace.package]
edition = "2024"
rust-version = "1.93"
license = "MPL-2.0"
repository = "https://github.com/F000NKKK/ReShip"
homepage = "https://github.com/F000NKKK/ReShip"
authors = ["ReShip Contributors", "F000NK"]

[workspace.dependencies]
# RSP is an independent nested workspace. ReShip may depend on RSP; RSP must
# never depend back on a reship-* crate.
rsp-core = { path = "protocol/rsp-core", version = "0.1.0" }
rsp-manifest = { path = "protocol/rsp-manifest", version = "0.1.0" }
rsp-discovery = { path = "protocol/rsp-discovery", version = "0.1.0" }
rsp-http = { path = "protocol/rsp-http", version = "0.1.0" }
reship-storage = { path = "crates/reship-storage", version = "0.1.0" }

axum = "0.8"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
